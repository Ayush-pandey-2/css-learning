<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            list-style: none;
        }

       a{
        text-decoration: none;
        color: black;
        font-size: 25px;
        font-family: sans-serif;
       }   
       
        .il{
            height: 50px;
            width: 200px;
            border: 1px black solid;
            text-align: center;
            display: inline-block;
            padding: 10px;
            box-sizing: border-box;
            
            
        }
        .il:hover{
            background-color: red;
            border: 0;
            border-radius: 50px;
            transition: 2s;
          
            
        }
        .il:hover a {
            color: white;
            font-family: cursive;
        }
    </style>
</head>
<body>

</html>
